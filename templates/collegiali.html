{% extends "base.html" %}

{% block content%} 
    <h3 style="text-align: center">Elenco dei Collegiali</h3> 

    <table text-align="center">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>
        {% for collegiale in collegiali_list %}
            <tr>
                <td> {{ collegiale.name }} </td>
                <td> {{ collegiale.age }} </td>
                <td> {{ collegiale.course }} </td>
            </tr>
                
        {% endfor %}
    </table>

{% endblock %}
